<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Himmel und Wiese -->
  <rect x="0" y="0" width="16" height="16" fill="#5ec8ff"/>
  <rect x="2" y="2" width="3" height="1" fill="#ffffff"/>
  <rect x="11" y="1" width="3" height="1" fill="#ffffff"/>
  <rect x="0" y="13" width="16" height="3" fill="#3fa34d"/>
  <rect x="0" y="13" width="16" height="1" fill="#63b04a"/>
  <!-- Mütze mit Stern -->
  <rect x="5" y="2" width="6" height="1" fill="#f0801e"/>
  <rect x="4" y="3" width="8" height="2" fill="#f0801e"/>
  <rect x="2" y="5" width="12" height="1" fill="#b5520f"/>
  <rect x="7" y="3" width="2" height="1" fill="#ffffff"/>
  <!-- Gesicht mit Haar und Augen -->
  <rect x="4" y="6" width="8" height="4" fill="#f7c79a"/>
  <rect x="3" y="7" width="1" height="3" fill="#7b4220"/>
  <rect x="12" y="7" width="1" height="3" fill="#7b4220"/>
  <rect x="6" y="7" width="1" height="2" fill="#1d1322"/>
  <rect x="9" y="7" width="1" height="2" fill="#1d1322"/>
  <rect x="7" y="9" width="2" height="1" fill="#d9925f"/>
  <!-- Schultern in Blau -->
  <rect x="3" y="10" width="10" height="3" fill="#2f6fd6"/>
  <rect x="7" y="10" width="2" height="1" fill="#ffd23f"/>
</svg>

# Deployt die Spielesammlung nach GitHub Pages:
# Startseite unter /, jedes Spiel in seinem Ordner: /gate-squad/, /scroll-shooter/, /go/, /sudoku/, /frontline/, /mario-craft/.
# Entwicklungsdateien (Tests, package.json, Pläne) werden nicht veröffentlicht.
# cat-queens/ ist TypeScript + Vite: wird hier gebaut, veröffentlicht wird nur cat-queens/dist/ unter /cat-queens/.
name: Deploy games to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node (Katzen-Queens)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cat-queens/package-lock.json
      - name: Build Katzen-Queens
        working-directory: cat-queens
        run: npm ci && npm run build
      - name: Prepare site
        run: |
          rsync -a --exclude '.git' --exclude '.github' --exclude '.claude' --exclude '.agent' --exclude '_site' --exclude 'cat-queens/' \
            --exclude 'test/' --exclude 'package.json' --exclude 'package-lock.json' --exclude 'node_modules/' ./ _site/
          mkdir -p _site/cat-queens && cp -r cat-queens/dist/. _site/cat-queens/
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

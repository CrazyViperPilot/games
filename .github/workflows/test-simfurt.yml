# Tests für Simfurt – läuft nur, wenn sich etwas in simfurt/ ändert.
name: Test Simfurt

on:
  push:
    branches: ["main"]
    paths: ["simfurt/**", ".github/workflows/test-simfurt.yml"]
  pull_request:
    paths: ["simfurt/**", ".github/workflows/test-simfurt.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node simfurt/test/sim.test.js

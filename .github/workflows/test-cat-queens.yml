# Tests für Katzen-Queens – läuft nur, wenn sich etwas in cat-queens/ ändert.
name: Test Katzen-Queens

on:
  push:
    branches: ["main"]
    paths: ["cat-queens/**", ".github/workflows/test-cat-queens.yml"]
  pull_request:
    paths: ["cat-queens/**", ".github/workflows/test-cat-queens.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cat-queens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cat-queens/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

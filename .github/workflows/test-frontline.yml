# Tests für Frontline – läuft nur, wenn sich etwas in frontline/ ändert (eigener Lebenszyklus je Spiel).
name: Test Frontline

on:
  push:
    branches: ["main"]
    paths: ["frontline/**", ".github/workflows/test-frontline.yml"]
  pull_request:
    paths: ["frontline/**", ".github/workflows/test-frontline.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

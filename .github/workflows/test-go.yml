# Tests für Go – läuft nur, wenn sich etwas in go/ ändert (eigener Lebenszyklus je Spiel).
name: Test Go

on:
  push:
    branches: ["main"]
    paths: ["go/**", ".github/workflows/test-go.yml"]
  pull_request:
    paths: ["go/**", ".github/workflows/test-go.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

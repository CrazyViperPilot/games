  <g fill="#4b5a3a" stroke="#9aa873" stroke-width="6" paint-order="stroke">
    <circle cx="200" cy="280" r="13"/>
    <rect x="185" y="297" width="30" height="63" rx="10"/>
    <circle cx="256" cy="280" r="13"/>
    <rect x="241" y="297" width="30" height="63" rx="10"/>
    <circle cx="312" cy="280" r="13"/>
    <rect x="297" y="297" width="30" height="63" rx="10"/>

  <!-- Boden -->
  <rect x="96" y="392" width="320" height="8" rx="3" fill="#39402f"/>
  <!-- Tor: Pfosten + Querbalken -->
  <rect x="140" y="140" width="26" height="252" rx="3" fill="#ff7a1a"/>
  <rect x="346" y="140" width="26" height="252" rx="3" fill="#ff7a1a"/>
  <rect x="128" y="124" width="256" height="32" rx="5" fill="#ff7a1a"/>

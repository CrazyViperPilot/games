<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2b1d14">
  <title>Fruhno</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="bar">
      <span class="logo">Fruhno</span>
      <span id="status"></span>
      <span class="spacer"></span>
      <button id="btn-chat" class="icon" aria-label="Chat">💬<i id="chat-badge" hidden></i></button>
      <button id="btn-menu" class="icon" aria-label="Menü">⚙️</button>
    </header>
    <main id="screen"></main>
    <aside id="chat" hidden>
      <div id="chat-log"></div>
      <form id="chat-form"><input id="chat-input" maxlength="200" autocomplete="off" placeholder="Nachricht…"><button>➤</button></form>
    </aside>
    <div id="modal" hidden></div>
    <div id="toast" hidden></div>
  </div>
  <script src="js/cards.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

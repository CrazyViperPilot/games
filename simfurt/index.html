<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f1722">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Simfurt</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="cv"></canvas>

  <header id="top">
    <div class="row hud">
      <span id="hDate" class="chip">Jan 1990</span>
      <span id="hMoney" class="chip money">0 €</span>
      <span id="hPop" class="chip">👥 0</span>
      <span id="hHappy" class="chip" title="Zufriedenheit">🙂 50</span>
    </div>
    <div class="row ctl">
      <div id="rci" title="Nachfrage: Wohnen, Gewerbe, Industrie, Banken">
        <div class="bar r"><i></i><b>W</b></div><div class="bar c"><i></i><b>G</b></div><div class="bar i"><i></i><b>I</b></div><div class="bar b"><i></i><b>B</b></div>
      </div>
      <div id="speed">
        <button data-sp="0" title="Pause (P)">⏸</button><button data-sp="1" title="Langsam (1)">▶</button><button data-sp="2" title="Mittel (2)">▶▶</button><button data-sp="3" title="Schnell (3)">▶▶▶</button>
      </div>
    </div>
  </header>

  <div id="ticker" hidden></div>
  <div id="tip" hidden></div>

  <div id="fab">
    <button id="bOverlay" title="Kartenansicht">👁<small>Ansicht</small></button>
    <button id="bCouncil" title="Stadtrat: Finanzen und Zufriedenheit">🏦<small>Rat</small></button>
    <button id="bMenu" title="Menü">☰<small>Menü</small></button>
    <div class="zoom"><button id="bZin">＋</button><button id="bZout">－</button></div>
  </div>

  <nav id="dock">
    <div id="items" hidden></div>
    <div id="cats"></div>
  </nav>

  <div id="sheet" hidden>
    <div class="panel">
      <div class="head"><h2 id="sTitle"></h2><button id="sClose" aria-label="Schließen">✕</button></div>
      <div id="sBody"></div>
    </div>
  </div>

  <div id="toast" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
